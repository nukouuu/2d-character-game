
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2Dゲーム</title>
<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #dceef7;
}

#character {
  position: absolute;
  width: 300px;
  height: 300px;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
}

.part {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: contain;
}

#tail { z-index: 1; }
#feet { z-index: 2; }
#body { z-index: 3; }
#arm { z-index: 4; }
#head { z-index: 5; }
#eyes { z-index: 6; }
#eyebrow { z-index: 7; }
#mouth { z-index: 8; }

#ground {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 100px;
  background: #78b96a;
}

#character {
  top: auto;
  bottom: 100px;
  transform: translateX(-50%);
}
</style>
</head>
<body>
<div id="ground"></div>

<div id="character">
  <img class="part" id="tail" src="tail.PNG">
  <img class="part" id="feet" src="feet.PNG">
  <img class="part" id="body" src="body.PNG">
  <img class="part" id="arm" src="arm.PNG">
  <img class="part" id="head" src="head.PNG">
  <img class="part" id="eyes" src="eyes_open.PNG">
  <img class="part" id="eyebrow" src="eyebrow.PNG">
  <img class="part" id="mouth" src="mouth.PNG">
</div>


<script>
const eyes = document.getElementById("eyes");

const eyeFrames = [
  "eyes_open.PNG",
  "eyes_half.PNG",
  "eyes_closed.PNG"
];

// 最初は必ず目を開く
eyes.src = eyeFrames[0];

// 画像を事前に読み込む
eyeFrames.forEach(src => {
  const img = new Image();
  img.src = src;
});

function blink() {
  // 半分閉じる
  eyes.src = eyeFrames[1];

  setTimeout(() => {
    // 完全に閉じる
    eyes.src = eyeFrames[2];

    setTimeout(() => {
      // 半分開く
      eyes.src = eyeFrames[1];

      setTimeout(() => {
        // 完全に開く
        eyes.src = eyeFrames[0];

        // 次のまばたきまで2〜5秒待つ
        scheduleBlink();
      }, 80);
    }, 100);
  }, 80);
}

function scheduleBlink() {
  const delay = 2000 + Math.random() * 3000;
  setTimeout(blink, delay);
}

// 最初のまばたきまで待機
scheduleBlink();
  
const character = document.getElementById("character");

const groundHeight = 100;
const gravity = 0.5;

let velocityY = 0;
let characterY = 200;

function updatePhysics() {
  velocityY += gravity;
  characterY -= velocityY;

  // 地面との当たり判定
  if (characterY <= groundHeight) {
    characterY = groundHeight;
    velocityY = 0;
  }

  character.style.bottom = characterY + "px";

  requestAnimationFrame(updatePhysics);
}

updatePhysics();

</script>
