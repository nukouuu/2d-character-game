
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2Dゲーム</title>
<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #dceef7;
}

#character {
  position: absolute;
  width: 300px;
  height: 300px;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
}

.part {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: contain;
}

#tail { z-index: 1; }
#feet { z-index: 2; }
#body { z-index: 3; }
#arm { z-index: 4; }
#head { z-index: 5; }
#eyes { z-index: 6; }
#eyebrow { z-index: 7; }
#mouth { z-index: 8; }

#ground {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 100px;
  background: #78b96a;
}

#character {
  top: auto;
  bottom: 100px;
  transform: translateX(-50%);
}
#controls {
  position: fixed;
  bottom: 25px;
  left: 25px;
  display: flex;
  gap: 15px;
  z-index: 100;
}

.move-btn {
  width: 75px;
  height: 75px;
  border: none;
  border-radius: 50%;
  background: #333a;
  color: white;
  font-size: 30px;
  font-weight: bold;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}
</style>
</head>
<body>
<div id="ground"></div>
<div id="controls">
  <button class="move-btn" id="leftBtn">◀</button>
  <button class="move-btn" id="rightBtn">▶</button>
</div>

<div id="character">
  <img class="part" id="tail" src="tail.PNG">
  <img class="part" id="feet" src="feet.PNG?v=2">
  <img class="part" id="body" src="body.PNG">
  <img class="part" id="arm" src="arm.PNG">
  <img class="part" id="head" src="head.PNG">
  <img class="part" id="eyes" src="eyes_open.PNG">
  <img class="part" id="eyebrow" src="eyebrow.PNG">
  <img class="part" id="mouth" src="mouth.PNG">
</div>


<script>
const eyes = document.getElementById("eyes");

const eyeFrames = [
  "eyes_open.PNG",
  "eyes_half.PNG",
  "eyes_closed.PNG"
];

// 最初は必ず目を開く
eyes.src = eyeFrames[0];

// 画像を事前に読み込む
eyeFrames.forEach(src => {
  const img = new Image();
  img.src = src;
});

function blink() {
  // 半分閉じる
  eyes.src = eyeFrames[1];

  setTimeout(() => {
    // 完全に閉じる
    eyes.src = eyeFrames[2];

    setTimeout(() => {
      // 半分開く
      eyes.src = eyeFrames[1];

      setTimeout(() => {
        // 完全に開く
        eyes.src = eyeFrames[0];

        // 次のまばたきまで2〜5秒待つ
        scheduleBlink();
      }, 80);
    }, 100);
  }, 80);
}

function scheduleBlink() {
  const delay = 2000 + Math.random() * 3000;
  setTimeout(blink, delay);
}

// 最初のまばたきまで待機
scheduleBlink();
  
const character = document.getElementById("character");

const groundHeight = 100;
const feetOffset = 65;
const gravity = 0.5;

let velocityY = 0;
let characterY = 200;

function updatePhysics() {
  velocityY += gravity;
  characterY -= velocityY;

  // 地面との当たり判定
  if (characterY <= groundHeight - feetOffset) {
  characterY = groundHeight - feetOffset;
  velocityY = 0;
  }

  character.style.bottom = characterY + "px";

  requestAnimationFrame(updatePhysics);
}

updatePhysics();

// 左右移動
let moveLeft = false;
let moveRight = false;

let playerX = window.innerWidth / 2;
const moveSpeed = 3;

const leftBtn = document.getElementById("leftBtn");
const rightBtn = document.getElementById("rightBtn");

// ボタンを押したとき
function setupButton(button, direction) {
  button.addEventListener("pointerdown", e => {
    e.preventDefault();
    button.setPointerCapture(e.pointerId);

    if (direction === "left") moveLeft = true;
    if (direction === "right") moveRight = true;
  });

  function stop() {
    if (direction === "left") moveLeft = false;
    if (direction === "right") moveRight = false;
  }

  button.addEventListener("pointerup", stop);
  button.addEventListener("pointercancel", stop);
  button.addEventListener("lostpointercapture", stop);
}

setupButton(leftBtn, "left");
setupButton(rightBtn, "right");

// 毎フレーム移動
function updateMovement() {
  if (moveLeft) playerX -= moveSpeed;
  if (moveRight) playerX += moveSpeed;

  // 画面外に出ないようにする
  const characterWidth = character.offsetWidth;

  playerX = Math.max(
    characterWidth / 2,
    Math.min(window.innerWidth - characterWidth / 2, playerX)
  );

  character.style.left = playerX + "px";

  requestAnimationFrame(updateMovement);
}

updateMovement();


</script>
