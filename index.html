
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2Dゲーム</title>
<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #dceef7;
}

#character {
  position: absolute;
  width: 300px;
  height: 300px;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
}

.part {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: contain;
}

#tail { z-index: 1; }
#feet { z-index: 2; }
#body { z-index: 3; }
#arm { z-index: 4; }
#head { z-index: 5; }
#eyes { z-index: 6; }
#eyebrow { z-index: 7; }
#mouth { z-index: 8; }

#ground {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 100px;
  background: #78b96a;
}

#character {
  top: auto;
  bottom: 100px;
  transform: translateX(-50%);
}

/* ジョイスティックの外側 */
#joystick {
  position: fixed;
  bottom: 35px;
  left: 30px;
  width: 120px;
  height: 120px;
  border-radius: 50%;
  background: rgba(0, 0, 0, 0.25);
  border: 2px solid rgba(255, 255, 255, 0.5);
  z-index: 100;
  touch-action: none;
  user-select: none;
}

/* ジョイスティックの内側 */
#stick {
  position: absolute;
  width: 55px;
  height: 55px;
  left: 50%;
  top: 50%;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.85);
  transform: translate(-50%, -50%);
  pointer-events: none;
}

</style>
</head>
<body>
<div id="ground"></div>
<div id="joystick">
  <div id="stick"></div>
</div>

<div id="character">
  <img class="part" id="tail" src="tail.PNG">
  <img class="part" id="feet" src="feet.PNG?v=2">
  <img class="part" id="body" src="body.PNG">
  <img class="part" id="arm" src="arm.PNG">
  <img class="part" id="head" src="head.PNG">
  <img class="part" id="eyes" src="eyes_open.PNG">
  <img class="part" id="eyebrow" src="eyebrow.PNG">
  <img class="part" id="mouth" src="mouth.PNG">
</div>


<script>
const eyes = document.getElementById("eyes");

const eyeFrames = [
  "eyes_open.PNG",
  "eyes_half.PNG",
  "eyes_closed.PNG"
];

// 最初は必ず目を開く
eyes.src = eyeFrames[0];

// 画像を事前に読み込む
eyeFrames.forEach(src => {
  const img = new Image();
  img.src = src;
});

function blink() {
  // 半分閉じる
  eyes.src = eyeFrames[1];

  setTimeout(() => {
    // 完全に閉じる
    eyes.src = eyeFrames[2];

    setTimeout(() => {
      // 半分開く
      eyes.src = eyeFrames[1];

      setTimeout(() => {
        // 完全に開く
        eyes.src = eyeFrames[0];

        // 次のまばたきまで2〜5秒待つ
        scheduleBlink();
      }, 80);
    }, 100);
  }, 80);
}

function scheduleBlink() {
  const delay = 2000 + Math.random() * 3000;
  setTimeout(blink, delay);
}

// 最初のまばたきまで待機
scheduleBlink();
  
const character = document.getElementById("character");

const groundHeight = 100;
const feetOffset = 65;
const gravity = 0.5;

let velocityY = 0;
let characterY = 200;

function updatePhysics() {
  velocityY += gravity;
  characterY -= velocityY;

  // 地面との当たり判定
  if (characterY <= groundHeight - feetOffset) {
  characterY = groundHeight - feetOffset;
  velocityY = 0;
  }

  character.style.bottom = characterY + "px";

  requestAnimationFrame(updatePhysics);
}

updatePhysics();


// ジョイスティック
const joystick = document.getElementById("joystick");
const stick = document.getElementById("stick");

let joystickX = 0;
let joystickActive = false;

const maxDistance = 40;

// 指を動かしたとき
function updateJoystick(e) {
  const rect = joystick.getBoundingClientRect();
  const centerX = rect.left + rect.width / 2;

  let dx = e.clientX - centerX;

  dx = Math.max(-maxDistance, Math.min(maxDistance, dx));

  joystickX = dx / maxDistance;

  stick.style.left = `calc(50% + ${dx}px)`;
}

joystick.addEventListener("pointerdown", e => {
  e.preventDefault();
  joystickActive = true;
  joystick.setPointerCapture(e.pointerId);
  updateJoystick(e);
});

joystick.addEventListener("pointermove", e => {
  if (joystickActive) updateJoystick(e);
});

function resetJoystick() {
  joystickActive = false;
  joystickX = 0;
  stick.style.left = "50%";
}

joystick.addEventListener("pointerup", resetJoystick);
joystick.addEventListener("pointercancel", resetJoystick);
joystick.addEventListener("lostpointercapture", resetJoystick);

// キャラクターの移動
let playerX = window.innerWidth / 2;
const moveSpeed = 4;

function updateMovement() {
  // 少しだけ倒した場合は動かない
  if (Math.abs(joystickX) > 0.15) {
    playerX += joystickX * moveSpeed;
  }

  const halfWidth = character.offsetWidth / 2;

  playerX = Math.max(
    halfWidth,
    Math.min(window.innerWidth - halfWidth, playerX)
  );

  character.style.left = playerX + "px";

  requestAnimationFrame(updateMovement);
}

updateMovement();

const feet = document.getElementById("feet");

const walkFrames = [
  "feet_right1.PNG",
  "feet_right2.PNG",
  "feet_left1.PNG",
  "feet_left2.PNG"
];

let walkFrame = 0;
let lastWalkTime = 0;
let wasWalking = false;

// 画像を事前に読み込む
walkFrames.forEach(src => {
  const img = new Image();
  img.src = src;
});

function updateWalkAnimation(time) {
  const isWalking = Math.abs(joystickX) > 0.15;

  if (isWalking) {
    if (!wasWalking || time - lastWalkTime > 120) {
      feet.src = walkFrames[walkFrame];
      walkFrame = (walkFrame + 1) % walkFrames.length;
      lastWalkTime = time;
    }
  } else if (wasWalking) {
    feet.src = "feet.PNG";
    walkFrame = 0;
  }

  wasWalking = isWalking;

  requestAnimationFrame(updateWalkAnimation);
}

requestAnimationFrame(updateWalkAnimation);


</script>
